# OMB v4 挂载补丁 —— profile 根层，一行一个开关。
#
# 为什么全部行都在 profile 根层（不可放进预设声明内）：
#   plugin-manager 的 listPlugins() 要求 entry.id === 'include' 才可寻址
#   （packages/boot/plugin-manager/src/index.ts:267）；预设内部的行挂在
#   preset-<id> 树下，会被标为 readOnlyReason: 'unaddressable'，插件页拨不动。
#   而「前端开关 = 文件开关」正是靠这一层实现的（写 cordis.patch.yml 的 disabled）。
#
# 每行的 `name` 是**组件包的裸顶层包名**（`@omb/<组件>`），对应 `packages/<组件>/`。
# 三个要求把它夹到唯一解，别改成别的写法：
#   ① 相对路径（`./lib-gen/g<N>/...`）**永远拿不到本地化元数据**——
#      `readPluginMeta` 见 `barePackageName(specifier) === undefined` 就放弃
#      （packages/boot/app-boot/src/package-meta.ts:148），插件页只会显示一串
#      `file:///` 路径，用户看不出哪个开关对应哪个组件。
#   ② 「裸包名 + 子路径」（`@omb/plugin/omb-kernel`）宿主**解析不了**：解析器按
#      `barePackageName(request)` 查拦截路由，拿到的是 `@omb/plugin`（不是任何
#      已注册依赖）→ 退回 Node 原生解析 → 8 行全部 "failed to import"（已实测）。
#   ③ 带 `?v=N` 会让宿主把 `?v=N` 当文件名字面量去找 → 同样加载失败。
# 只有"一个组件 = 一个独立顶层包"同时满足"能解析"与"有中文名"。
#
# 换代（`lib-gen/g<N>/`）**不写在本文件里**：`scripts/build.mjs` 每次构建刷新
# `packages/<组件>/package.json` 的 main/exports 指向新代，URL 随之变化，
# 因此必然加载到本次构建的代码（绕过 Node 的 ESM 按 URL 缓存）。
# 开发循环：改码 → pnpm build → 重新启用该行（或新会话）。
#
# `name` 的落点规则：**模块入口属于模块自己**（`modules/<name>/index.ts` 或 `module.ts`），
# 组件包入口（`packages/<组件>/index.ts`）只做 re-export + `export default toHostPlugin(...)`，
# 不复制任何实现——否则每加一个模块要改三处。

- insert:
    # ── 微内核（必需）────────────────────────────────────────────
    - id: omb-kernel
      name: '@omb/kernel'
      config:
        debug: false

    # ── 记忆库（向量通道可单独关；关联扩展与多查询是它的子能力，各自提供工具）──
    # `commands` 是**宿主**服务（斜杠命令注册表）：3.6 起 `/omb-privacy` 的命令注册
    # 从记忆库的 apply 走，因此这条行级 inject 跟着从 `omb-privacy` 那一行搬到这里。
    # 它的作用仍是"等宿主门就绪"（**不是**模块间依赖），判据见 tests/dsh/module-graph-source.test.ts。
    # 隐私模式（原 `omb-privacy` 行）已并入本行：服务名仍是 `SERVICES.privacy`，
    # 制品索引（`omb-artifact`）与库访问边界两个消费者零改动。
    - id: omb-memory
      name: '@omb/memory'
      inject: ['omb:kernel', 'commands']
      config:
        embeddingThreads: 2
        # 隐私闸门（原 omb-privacy 行的 config 块，逐项照搬）
        privacy:
          # 状态读不出时的基线（fail-closed）：sealed = 最严；只想禁写可改 read-only
          failClosedMode: sealed
    - id: omb-memory-vector
      name: '@omb/memory-vector'
      inject: ['omb:kernel']

    # ── 用户画像 ─────────────────────────────────────────────────
    - id: omb-profile
      name: '@omb/profile'
      inject: ['omb:kernel']
      config:
        # 能力轴默认关闭，且**永不落盘**：错误成本不对称（高估用户会产生自信的错误帮助）
        inferCapabilityAxis: false

    # ── 过程/循环层（v4：方法卡在 skills/，这里只剩常驻入口与循环检测）──
    - id: omb-reasoning
      name: '@omb/reasoning'
      inject: ['omb:kernel']

    # ── 制品索引 / 通知桥 ────────────────────────────────────────
    - id: omb-artifact
      name: '@omb/artifact'
      inject: ['omb:kernel']
    - id: omb-notify
      name: '@omb/notify'
      inject: ['omb:kernel']

    # ── 大肥鱼模式预设 ───────────────────────────────────────────
    # 内部**不含任何 OMB 认知行**：认知行全在上面的 profile 根层，
    # 因此「所有模式均可使用」成立，且每一行都能在插件页拨动。
    - id: preset-omb
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: omb
        name: 大肥鱼模式
        description: 包含创造模式的所有能力，并使用 OMB v4 通用认知增强。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是运行在「大肥鱼模式」下基于 {{model}} 的智能体。
              # **不要再加 `suffix: 你的工作目录是 {{cwd}}。`**
              #
              # 那句在 DSH 0.2.1-a2 上会让**整轮运行失败**：
              #   unknown prompt variable "{{cwd}}" in section "deployment:persona-suffix";
              #   registered variables: provider, model
              #
              # 两个独立原因，任何一个都足以否掉它：
              #   ① **`cwd` 从来不是内置变量**。DSH 核心只注册 `provider` / `model`
              #      （`packages/core/agent-loop/src/index.ts:389-390`）；`cwd` 必须由某个插件
              #      显式 `ctx.systemPrompt.variable('cwd', …)` 注册，而没有任何内置包这么做
              #      （`packages/core/system-prompt/tests/system-prompt.spec.ts:205-213` 就是
              #      拿 `{{cwd}}` 当"未注册变量"的反例来测的）。插值是**严格**的：遇到未注册
              #      变量直接抛，不是原样保留。
              #   ② **它本来就是多余的**。DSH 已经用一条独立通道把工作目录交给模型：
              #      `@deepseek-ai/dsh-working-directory`（`packages/bundle/base/cordis.patch.yml:161`）
              #      贡献上下文段 `working-directory:current`，且 `interpolate: false`。
              #      在这里再写一遍，等于同一个事实说两遍——而第二遍还带着一个会炸的变量。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # 工具面逐行抄自 DSH 自带的**创造模式**预设
          # （`packages/bundle/web-app/presets/cordis.patch.yml`）。
          #
          # **0.2.1-rc.2 对齐（2026-10-18）**：相对 0.2.0-rc.2，创造模式新增了
          # `time-context` / `tool-schedule` / `tool-plugin-market` 三行，删除了
          # `tool-subagent-codex` / `tool-subagent-claude-code` / `tool-ralph` 三行与
          # `backgroundMode` 字段（后者在 rc.2 已是运行时概念、不再是 config 键——
          #  schemastery 的 `strict` 默认为 false，未知键会被**静默合并**，永不生效）。
          # 本列表已逐行跟上；护栏是 `tests/dsh/preset-composition.test.ts`。
          #
          # **0.2.1-rc.3 对齐（2026-10-25）**：宿主线又改了两处委派行，已逐字跟上：
          # ① `@deepseek-ai/dsh-tool-subagent-control/list-agents` 子路径导出被移除，
          #    `list_agents` 改由主插件注册——再写那一行会让**整个预设 broken**
          #    （所有 `agentPreset=omb` 的旧会话打开时显示"会话不可用"）；
          # ② `tool-subagent` 的配置键 `modelSelectionSettings` 改名为
          #    `modelSelection` + `modelDiscovery`，旧键被静默合并、永不生效。
          # 这两条由上面的注释行与测试 `preset-composition.test.ts` 同时钉住。
          #
          # **为什么抄创造模式而不是标准模式**：创造模式才是全的那一份——
          # standard 少了 `tool-cordis`、少了 `skill-filesystem` 的 customSkillDirs、
          # 少了 `present`，而且它的 `tool-plugin-manager` 是**禁用**的；
          # 创造模式则按 `profileContext` 条件启用。
          #
          # **为什么必须抄全**：这个列表就是"用这个模式时模型手里有什么"。
          # 曾经这里只有 persona + agent-instructions，注释写到这里就断了——
          # 后果是 OMB 模式下**一个文件/命令工具都没有**：自检会话读不了
          # `build-generation.json`，于是"宿主跑的是哪一代产物"根本无从核对。
          # 认知层再好，没有手脚也验证不了自己。
          #
          # **去掉的项（相对创造模式）**：
          # ① `tool-cordis`（Cordis 源码导航）——那是给"改 DSH 自身"用的，
          #    与 OMB 的日常认知任务无关，且它有 `cordis_inspect_*` 一族工具面。
          #    这是**唯一**有意的差异；其余行必须与创造模式一致（含上面的 3 行新增）。
          #
          # **恢复的项**：② `compaction` 组（compaction-basic / command-compact /
          #    tool-result-pruner）。原先整组去掉的理由是"OMB 是拉取式 + 软压力档位，
          #    再叠自动压缩冗余且互相干扰"——**读实现后判定这个理由不成立**：
          #    OMB 的上下文优化只**读** tokenMeter 且**从不改会话历史**（拉取台账只数
          #    拉取次数与轮数），压缩改的是历史体量，二者是两条轴。
          #    逐条证据与开/关决定见 `docs/dsh-compatibility.md` §4。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          # ── 自动压缩（恢复）──────────────────────────────────────────────
          # 逐行与 DSH 自带创造模式预设一致
          # （`packages/bundle/web-app/presets/cordis.patch.yml:62-78`），
          # 位置也一致：紧接 `planning` 组之后。三行各司其职，且都不碰 OMB 的判据：
          #   · compaction-basic   按 `ctx.tokenMeter` 压力在**步边界**触发
          #                        （thresholdRatio 0.8、headroom 65536、retainRatio 0.16），
          #                        把一段历史替换成**一个摘要节点**（会调一次模型）；
          #   · tool-result-pruner 纯确定性：工具结果超过 8192 字符就保留
          #                        head 4096 + tail 1024，原文仍可经 shadowed node 追回；
          #   · command-compact   只由人打 `/compact` 触发，无自主行为。
          # OMB 不再持有上下文组件（v4）：下面三行是**宿主自己的**上下文管理，
          # OMB 只读 tokenMeter 投影用于状态面，从不改会话历史，因此不冲突。
          # 详情：`docs/dsh-compatibility.md` §4。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              # 0.2.1-rc.3 的宿主线（commit 4df09d37d5，2026-10-23 之后）移除了
              # `./list-agents` 子路径导出，`list_agents` 改由本行主插件一起注册。
              # **不要再加回子路径行**：一行导入失败会让整个大肥鱼预设变成 broken，
              # 所有 agentPreset=omb 的旧会话打开时显示"会话不可用"
              # （OMB 自身模块不报错，所以很难定位）。护栏：preset-composition.test.ts。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  # rc.3 起的字段名：modelSelection + modelDiscovery。
                  # 旧 modelSelectionSettings 会被 schemastery 静默合并、永不生效。
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
                # OMB 自己的过程卡（v4：8 张方法卡从 `omb_method` 工具迁到 skills）。
                # 目录随插件包发布；skill 正文只在模型调用 `skill` 时读取，不占常驻预算。
                # 不能 join(baseUrl,'skills')：baseUrl 是**当前补丁层**的目录
                # （file URL），对 bundle 层而言可能是 profile 根而不是插件根。
                # 用 createRequire(baseUrl) 解析出 @omb/plugin 的 package.json，
                # 再从它的目录取 skills——对两种 baseUrl 都成立（实测）。
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@omb/plugin/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: !!js "!ctx.get('profileContext')"
