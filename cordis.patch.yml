# OMB v3 挂载补丁 —— profile 根层，一行一个开关。
#
# 为什么全部行都在 profile 根层（不可放进预设声明内）：
#   plugin-manager 的 listPlugins() 要求 entry.id === 'include' 才可寻址
#   （packages/boot/plugin-manager/src/index.ts:267）；预设内部的行挂在
#   preset-<id> 树下，会被标为 readOnlyReason: 'unaddressable'，插件页拨不动。
#   而「前端开关 = 文件开关」正是靠这一层实现的（写 cordis.patch.yml 的 disabled）。
#
# name 里的相对路径锚定**本补丁文件所在目录**（loader 的 ctx.baseUrl），
# 因此 './lib-gen/g1/...' 指仓库根的构建产物。开发循环：改码 → pnpm build → 递增 ?v=N → 新会话。
#
# `name` 的落点规则：**模块入口属于模块自己**（`modules/<name>/index.ts` 或 `module.ts`），
# 不在 dsh/ 下复制一层"入口文件"——否则每加一个模块要改两处。
# 只有微内核入口在 dsh/（它就是插件本体）。

- insert:
    # ── 微内核（必需）────────────────────────────────────────────
    - id: omb-kernel
      name: './lib-gen/g1/dsh/kernel.js'
      config:
        debug: false

    # ── 记忆库（向量通道可单独关；关联扩展与多查询是它的子能力，各自提供工具）──
    - id: omb-memory
      name: './lib-gen/g1/modules/memory/index.js'
      config:
        consolidationEveryTurns: 32
        embeddingThreads: 2
    - id: omb-memory-vector
      name: './lib-gen/g1/modules/memory/vector.js'

    # ── 用户画像 ─────────────────────────────────────────────────
    - id: omb-profile
      name: './lib-gen/g1/modules/profile/index.js'
      config:
        # 能力轴默认关闭，且**永不落盘**：错误成本不对称（高估用户会产生自信的错误帮助）
        inferCapabilityAxis: false

    # ── 思维链质量层 ─────────────────────────────────────────────
    - id: omb-reasoning
      name: './lib-gen/g1/modules/reasoning/index.js'
      config:
        defaultDepth: standard

    # ── 上下文优化 ───────────────────────────────────────────────
    - id: omb-context
      name: './lib-gen/g1/modules/context/index.js'
      config:
        # 软压力档位，**不是每回合 token 上限**；阈值从测量标定
        pressureBands: [0.3, 0.6]
        candidateConsiderLimit: 12

    # ── 制品索引 / 通知桥 ────────────────────────────────────────
    - id: omb-artifact
      name: './lib-gen/g1/modules/artifact/module.js'
    - id: omb-notify
      name: './lib-gen/g1/modules/notify/index.js'

    # ── 大肥鱼模式预设 ───────────────────────────────────────────
    # 内部**不含任何 OMB 认知行**：认知行全在上面的 profile 根层，
    # 因此「所有模式均可使用」成立，且每一行都能在插件页拨动。
    - id: preset-omb
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: omb
        name: 大肥鱼模式
        description: OMB v3 通用认知增强（思维链质量 / 记忆 / 上下文优化）
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是运行在「大肥鱼模式」（OMB v3 认知增强）下的智能体，基于 {{model}} 模型。
              suffix: 你的工作目录是 {{cwd}}。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # 工具面逐行抄自 DSH 自带 standard 预设
          # （packages/bundle/web-app/presets/standard.patch.yml:20-146）
          # 施工时逐行核对，不要凭记忆写。
