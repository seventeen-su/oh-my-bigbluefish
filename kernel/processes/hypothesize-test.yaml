# 认知过程 2：HYPOTHESIZE → DISCRIMINATE → EXECUTE → OBSERVE → UPDATE → STOP（假设-检验闭环）
# 过程 = 数据化程序（架构 §4.2 P1 / §5.3 Operator ABI）。
# M2 阶段只做数据与校验，不执行（执行在 M4）；改本文件即改行为，代码不感知内容。
id: hypothesize-test
version: 1.0.0
entry: HYPOTHESIZE
exit: STOP
budget:
  tokens: 16000
  time_ms: 120000
operators:
  - id: hypothesize
    op: HYPOTHESIZE
    input_binding: { state: "$.working", n: 3 }
    output: hypotheses
    cost: { tokens: 3000, time_ms: 8000 }
    verification: "hypotheses 为 1..n 个合法 Hypothesis 对象"
    error: { retryable: false, timeout_ms: 20000, cancelable: true, rollback: "无副作用" }
  - id: discriminate
    op: DISCRIMINATE
    input_binding: { hypotheses: "$.hypotheses", gaps: "$.working.evidence_gaps" }
    output: experiment_plan
    cost: { tokens: 2000, time_ms: 8000 }
    verification: "experiment_plan 覆盖全部活跃假设的判别观测"
    error: { retryable: false, timeout_ms: 15000, cancelable: true, rollback: "无副作用" }
  - id: execute
    op: EXECUTE
    input_binding: { plan: "$.experiment_plan" }
    output: tool_results
    cost: { tokens: 4000, time_ms: 60000 }
    verification: "tool_results 与 plan 一一对应"
    error: { retryable: true, timeout_ms: 30000, cancelable: true, rollback: "按 ActionContract 回滚路径执行" }
  - id: observe
    op: OBSERVE
    input_binding: { results: "$.tool_results", plan: "$.experiment_plan" }
    output: observations
    cost: { tokens: 1500, time_ms: 5000 }
    verification: "observations 引用对应 tool_results 与时间戳"
    error: { retryable: false, timeout_ms: 5000, cancelable: true, rollback: "无副作用" }
  - id: update
    op: UPDATE
    input_binding: { state: "$.working", observations: "$.observations" }
    output: state_patch
    cost: { tokens: 1500, time_ms: 5000 }
    verification: "state_patch 使假设状态机合法迁移（活动→判别/拒绝/确认）"
    error: { retryable: false, timeout_ms: 5000, cancelable: true, rollback: "无副作用" }
  - id: stop
    op: STOP
    input_binding: { state: "$.working", patch: "$.state_patch" }
    output: stop_report
    cost: { tokens: 200, time_ms: 1000 }
    verification: "stop_report 含最终结论、证据引用与下一步"
    error: { retryable: false, timeout_ms: 1000, cancelable: false, rollback: "无" }
