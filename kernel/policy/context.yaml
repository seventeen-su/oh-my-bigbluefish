# Context Compiler 参数（架构 §6.1：marginal = ΔInfoValue − token − reacquisition − attention_pollution − regression_risk）
# 初值（§17 开放项，启发式初值，冻结基准产出后修正）；working_state_never_compress 为架构硬约束（§6.1 绝不盲压缩）；
# marginal_weights 与 kind_costs 均为数据：改本文件即生效，代码不感知内容。
# R7（候选来源扩展）：kind_costs 新增 evidence/capability/process（设计全集 Memory/Evidence/Capability/
#   Process/Artifact，§6.1 候选集）——初值为来源侧启发式（evidence 重获取 ≈ retrieval 需再查事件库；
#   capability 重获取成本低=注册表直取；process 重获取高=需重新调度），待 §17 标定。
marginal_weights:
  info_value: 1.0           # Δ信息价值权重
  token_cost: 0.5           # token 成本权重
  reacquisition: 0.8        # 重获取成本权重
  attention_pollution: 0.4  # 注意力污染权重
  regression_risk: 0.6      # 回归风险权重
working_state_never_compress: true  # Working State 绝不盲压缩
# kind 成本表（§6.1 reacquisition/attention_pollution/regression_risk）
# 初值，待冻结基准标定（§17）——改本表即改边际，代码不感知内容（机制即数据）
kind_costs:
  reacquisition:            # 按 kind 恢复该内容的代价（working_state 每请求自带 → 0）
    code: 30
    json: 25
    logs: 15
    retrieval: 40
    memory: 20
    working_state: 0
    artifact: 35
    evidence: 40            # R7：需再查事件库（≈ retrieval）
    capability: 5           # R7：注册表直取（低）
    process: 40             # R7：需重新调度（高）
  attention_pollution:      # 噪音/无关内容对注意力的干扰（日志噪音最高）
    code: 15
    json: 10
    logs: 30
    retrieval: 8
    memory: 5
    working_state: 5
    artifact: 10
    evidence: 8             # R7：事实链相关性高（低）
    capability: 5           # R7：可用能力清单（低）
    process: 5              # R7：决策过程（低）
  regression_risk:          # 投影干扰任务执行的风险
    code: 10
    json: 8
    logs: 12
    retrieval: 5
    memory: 8
    working_state: 5
    artifact: 6
    evidence: 5             # R7：会话事实（低）
    capability: 3           # R7：能力声明（最低）
    process: 2              # R7：决策过程（最低）
