# Evolve 策略（架构 §6.5.1 触发链 / §6.5.6 Daily Evolution Budget / §6.5.7 维护债务 + 实现规格 §10.1；P1c）
#
# 数据即机制（P3）：改本文件即改演化判定与维护债务阈值（loadPolicy 深冻结；非法内容 fail-loud）。
# 判定为纯函数（kernel/evolve-decision.ts decideEvolution）：输入信号摘要 + 本策略 → 确定性输出
# {should_evolve, strength, object_layer, budget_estimate}。
#
# 语义（架构/实现规格）：
#   - daily_evolution_cost：evolution_cost/day 上限（仅 DSH 运行期间累计；§6.5.6）
#   - roi_min：Learning ROI 门槛（价值/成本 低于则不优先演化；§6.5.6）
#   - maintenance_rate：LLM 维护率软预算（0..1，超预算降优先级，非硬禁止；§6.5.6）
#   - debt_thresholds：soft → 提高 quantum 频率；hard → 限制非必要演化；critical → 请求边界强制插入 quantum（§6.5.7）
#   - signal_triggers：触发信号种类 → 是否演化/强度/对象层（§6.5.1 判定表；evolve:false 的条目仅记账不演化）
# P1d 候选管线门禁（§6.5.3 验证链 G3 / §6.5.2 生成器步长，数据化防激进）：
#   - candidate_gate.max_candidates_per_run：单次 /evolve（与空闲期量子）最多生成+验证候选数 K（预算守卫）
#   - candidate_gate.max_step_ratio：参数单次调整相对步长上限（strength 绝对/ratio 相对均封顶）
#   - candidate_gate.cost_degradation_tolerance：G3 成本劣化容忍（基准报告比较语义，超此值拒绝）
# P1e 晋升门禁（§6.5.3 防退化「只接受通过全部门 + fitness 不降」+ §7 三层信号；stable ← trusted-latest 显式门禁）：
#   - promotion_gate.min_shadow_samples：L2 shadow exposure 样本纳入判定的最低数
#     （n ≥ 此值才按失败率判定；n=0 → 无 shadow 数据不阻塞，以基准门禁为准）
#   - promotion_gate.max_shadow_failure_rate：L2 shadow 失败率上限（n 足够时超此值拒晋升，后验不劣化）
#   - promotion_gate.cost_degradation_tolerance：L1 成本劣化容忍（缺省回退 candidate_gate 同值——向后兼容）
# P7 金丝雀判定主判开关（§10.3 Anytime-valid Certificate——anytime-valid 为主判，初值规则保留为降级/对照）：
#   - e_process.mode：'e-process'（自实现 Bernoulli 超鞅主判）| 'rule'（初值规则主判，降级/对照）
#   - e_process.fallback_to_rule：e-process 判定异常 → 回退初值规则（fail-safe 不静默吞错）
# S2 维护任务成本估计（§10.1 estimated_cost 数据化；priority = EV/C × debt 的 C）：
#   - maintenance_costs：每维护任务 estimated_cost 初值（memory+4/candidate+10/repair+25/检查类+2/gc+2——
#     取值 ≥ 权重 → 债务任务 ROI ≤ 1，低于会话级收尾任务（turn-finalize ROI 1），既有调度顺序不破坏）；
#   - 初值 + 观测中：无真实维护执行数据 → 不臆造标定；最终值待 .evolution/maintenance-observations
#     数据积累后按 §10.1 ROI 观测标定（改本段即生效）；
#   - 缺省兼容旧形状（无本段/部分键 → 出厂初值）；字段存在但非法（负数/非数值）→ fail-loud。
# S7 per-session shadow 真实放量路由（实现规格 §5.3 Shadow 流量分配；G4 真实放量）：
#   - shadow.enabled：全局开关（缺省开启；无 trusted-latest 差异/缺失时零开销不路由）
#   - shadow.exposure_rate：曝光率（0..100 整数：bucket = hash(session_id + candidate_id) % 100 <
#     exposure_rate 的会话路由到 latest 线快照运行（per-request 生效：快照身份/线状态真实变化 +
#     policy/processes 按线加载）+ exposure/outcome 落盘（.evolution/shadows/exposure-<date>.jsonl）→
#     promotion gate L2 消费真实 outcome（readShadowSignals））
# 初值待冻结基准标定（架构 §17）。
daily_evolution_cost: 100
roi_min: 1.0
maintenance_rate: 0.5

maintenance_costs:
  memory_consolidation: 4
  candidate_validation: 10
  repair: 25
  promotion_check: 2
  environment_check: 2
  evolution_decision: 2
  gc: 2

shadow:
  enabled: true
  exposure_rate: 10

e_process:
  mode: e-process
  fallback_to_rule: true

candidate_gate:
  max_candidates_per_run: 3
  max_step_ratio: 0.2
  cost_degradation_tolerance: 0.1

promotion_gate:
  min_shadow_samples: 0
  max_shadow_failure_rate: 0.1
  cost_degradation_tolerance: 0.1

# R8 集体共享显式开关（架构 §13 共享与集体演化——生产默认不自动发布/吸收）：
#   - publish_mechanism_objects：自动发布机制级 Evolution Object（默认 false——生产不自动发布；
#     隐私原则：仅发布机制数据（策略 diff/验证门/bench 元数据/provenance），绝不发布私人记忆/会话内容；
#     本次无自动发布路径——本配置为未来自动路径预留；显式命令 /evolve share 始终可用，不受本配置影响）
#   - auto_discover：自动发现/吸收外部对象（默认 false——生产不自动吸收；为未来自动路径预留；
#     显式命令 /evolve absorb <id> 始终可用）
#   - registry_dir：本地 registry 目录（缺省 <evolutionRoot>/registry = workspace/.omb/.evolution/registry；
#     相对路径相对演化工作区根解析）
share:
  publish_mechanism_objects: false
  auto_discover: false

debt_thresholds:
  soft: 10        # 对齐 MaintenanceScheduler DEFAULT_SOFT_LIMIT（债务 ≥ → quantum 频率提升）
  hard: 50        # 对齐 MaintenanceScheduler DEFAULT_HARD_LIMIT（债务 ≥ → 非必要演化受限）
  critical: 100   # 待标定 §17（critical → 请求边界强制插入 quantum）

signal_triggers:
  # ---- 失败/缺口类（触发演化） ----
  corrections:                  # 修正/失败模式 → repair（L1 代码修复；最高强度）
    evolve: true
    strength: 0.9
    object_layer: L1
  oracle_fail:                  # reproduction oracle 复现失败 → repair（L1）
    evolve: true
    strength: 0.8
    object_layer: L1
  scope_miss:                   # 检索泛化缺口 → candidate_validation（L0 数据候选）
    evolve: true
    strength: 0.5
    object_layer: L0
  untrusted_object:             # 信任池污染信号 → candidate_validation（L0 数据候选）
    evolve: true
    strength: 0.4
    object_layer: L0
  # ---- 活跃/正向类（仅记账 consolidation，不触发演化——防噪声演化） ----
  tool_calls:
    evolve: false
    strength: 0.0
    object_layer: L0
  retrieval_calls:
    evolve: false
    strength: 0.0
    object_layer: L0
  memory_ops:
    evolve: false
    strength: 0.0
    object_layer: L0
  reads:
    evolve: false
    strength: 0.0
    object_layer: L0
  hits:
    evolve: false
    strength: 0.0
    object_layer: L0
  scope_hit:
    evolve: false
    strength: 0.0
    object_layer: L0
  oracle_pass:
    evolve: false
    strength: 0.0
    object_layer: L0
  trusted_object:
    evolve: false
    strength: 0.0
    object_layer: L0
