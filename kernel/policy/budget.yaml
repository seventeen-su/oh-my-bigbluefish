# 计算分配器六维预算（架构 §5.1）+ Context Compiler 投影预算（§6.1）
# 初值，待冻结基准标定（架构 §17）——冻结基准集产出后修正本文件即可，代码不感知内容。
# §17 标定回写（2026-08-23，P6）：context_budget_tokens 已以真实基准数据回写（见行内注释）；
# 其余字段（depth/breadth/tools/retrieval/branches/context）无对应真实依据，保持初值待标定。
depth: 8            # 推理深度（层数上限）
breadth: 4          # 单层并行分支宽度上限
tools: 12           # 单请求工具调用上限
retrieval: 6        # 单请求检索调用上限
branches: 8         # 全请求分支总数上限
context: 16000      # 上下文 token 总量预算
# §17 标定回写（2026-08-23，D8）：context_budget_tokens = 真实 model_tokens 均值 × 1.2（T8.20 公式）
#   数据源：workspace/.omb/bench/real-v2-stable-2026-08-23T14-21-35-583Z.jsonl（2026-08-23 真实执行 20/20）
#   公式值 = 223.45 × 1.2 = 268.14（< 500）→ 取 500 保底：投影预算不得低于架构 §M2 出口标准
#   「固定开销 ≤500 token」（静态契约说明 + working_state 动态尾部，task-2.4 实测 ~110）——
#   预算低于该语义会在请求实际需要 ~500 token 固定内容时截断保证投影，违背出口标准。
#   500 相对真实均值 223.45 留 2.24× 余量、相对 P90 375 留 1.33× 余量。
context_budget_tokens: 500   # Context Compiler 投影预算（§17 标定回写：4000 → 500，见上方计算）
# P5：LLM 生成预算（架构 §5.3 Generate 阶梯最后手段 / D7：受 generation budget 约束；数据可演化，代码不感知内容）
generation:
  enabled: true                 # LLM 生成开关（阶梯不满足 + 预算允许 + adapter 存在 → 走 LLM；false → 纯规则降级）
  max_generate_per_request: 1   # 单请求 LLM 生成调用次数上限（超上限 → 纯规则降级并记录）
  max_generate_tokens: 4000     # HYPOTHESIZE 输出 token 上限（adapter.generate maxTokens）
  reasoning_effort: low         # 推理档位（默认 low，防推理吃光输出预算；high/max 按需显式配置）
